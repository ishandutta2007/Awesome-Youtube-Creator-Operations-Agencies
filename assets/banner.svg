<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="45%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>

    <!-- YouTube Brand & Accent Gradients -->
    <linearGradient id="ytRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0033" />
      <stop offset="100%" stop-color="#CC0000" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.92" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <style>
    @keyframes pulseAura {
      0%, 100% { opacity: 0.28; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.06); }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatCardA {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatCardB {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    @keyframes nodeBlink {
      0%, 100% { opacity: 0.4; r: 4px; }
      50% { opacity: 1; r: 6.5px; }
    }
    @keyframes meterExpand {
      0%, 100% { width: 85px; }
      50% { width: 115px; }
    }
    @keyframes borderChase {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 1600; }
    }

    .ambient-pulse {
      transform-origin: center;
      animation: pulseAura 7s ease-in-out infinite;
    }
    .flow-stream {
      stroke-dasharray: 8, 12;
      animation: dashStream 8s linear infinite;
    }
    .floating-a {
      animation: floatCardA 5.5s ease-in-out infinite;
    }
    .floating-b {
      animation: floatCardB 6.2s ease-in-out infinite 0.6s;
    }
    .blinking-node {
      animation: nodeBlink 2.8s ease-in-out infinite;
    }
    .border-orbit {
      stroke-dasharray: 120, 280;
      animation: borderChase 18s linear infinite;
    }
    .meter-bar {
      animation: meterExpand 4s ease-in-out infinite;
    }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      fill: #94a3b8;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glows (Behind Everything) -->
  <circle cx="150" cy="110" r="140" fill="#FF0033" opacity="0.18" class="ambient-pulse" filter="url(#softGlow)" />
  <circle cx="1060" cy="200" r="180" fill="#8b5cf6" opacity="0.22" class="ambient-pulse" filter="url(#softGlow)" />
  <circle cx="820" cy="340" r="130" fill="#06b6d4" opacity="0.15" class="ambient-pulse" filter="url(#softGlow)" />

  <!-- Subtle Blueprint Tech Grid Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M 0 60 H 1200 M 0 120 H 1200 M 0 180 H 1200 M 0 240 H 1200 M 0 300 H 1200 M 0 360 H 1200" />
    <path d="M 120 0 V 420 M 240 0 V 420 M 360 0 V 420 M 480 0 V 420 M 600 0 V 420 M 720 0 V 420 M 840 0 V 420 M 960 0 V 420 M 1080 0 V 420" />
  </g>

  <!-- Animated Stream Lines / Agency Pipeline Flow (Positioned to the right to avoid title) -->
  <g opacity="0.45">
    <path d="M 720 110 C 820 110, 840 180, 940 180 C 1020 180, 1060 140, 1140 140" fill="none" stroke="url(#cyanAccent)" stroke-width="2.5" class="flow-stream" />
    <path d="M 740 260 C 820 260, 860 210, 960 210 C 1040 210, 1080 270, 1150 270" fill="none" stroke="url(#purpleGlow)" stroke-width="2" class="flow-stream" />
    <path d="M 700 330 C 800 330, 850 300, 950 300 C 1020 300, 1080 340, 1140 340" fill="none" stroke="url(#ytRed)" stroke-width="2" class="flow-stream" />
  </g>

  <!-- Flow Nodes (Blinking) -->
  <circle cx="720" cy="110" r="5" fill="#06b6d4" class="blinking-node" />
  <circle cx="940" cy="180" r="5" fill="#38bdf8" class="blinking-node" />
  <circle cx="960" cy="210" r="5" fill="#a855f7" class="blinking-node" />
  <circle cx="740" cy="260" r="5" fill="#c084fc" class="blinking-node" />
  <circle cx="950" cy="300" r="5" fill="#FF4D4D" class="blinking-node" />

  <!-- Outer Animated Border Glow Orbit -->
  <rect x="2" y="2" width="1196" height="416" rx="15" fill="none" stroke="url(#cyanAccent)" stroke-width="2" opacity="0.4" class="border-orbit" />

  <!-- ================= RIGHT-SIDE FLOATING CARDS (AGENCY OPERATIONS WIDGETS) ================= -->

  <!-- Widget Card 1: Sponsor & Deal CRM (Floating A) -->
  <g class="floating-a" transform="translate(810, 48)" filter="url(#cardShadow)">
    <rect width="320" height="96" rx="12" fill="url(#glassCard)" stroke="#334155" stroke-width="1.2" />
    <circle cx="34" cy="36" r="15" fill="#FF0033" opacity="0.9" />
    <!-- YouTube Play Icon in Circle -->
    <polygon points="31,30 40,36 31,42" fill="#ffffff" />
    
    <text x="60" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Brand Sponsorship Deal Pipeline</text>
    <text x="60" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Nike x Tech Reviewer • 3-Video Integration</text>
    
    <rect x="60" y="62" width="160" height="7" rx="3.5" fill="#334155" />
    <rect x="60" y="62" width="124" height="7" rx="3.5" fill="url(#cyanAccent)" />
    <text x="230" y="69" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">$45,000</text>
    
    <rect x="252" y="22" width="54" height="18" rx="9" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="0.8" />
    <text x="279" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#34d399" text-anchor="middle">CLOSED</text>
  </g>

  <!-- Widget Card 2: Revenue Split & Talent Ops (Floating B) -->
  <g class="floating-b" transform="translate(850, 168)" filter="url(#cardShadow)">
    <rect width="300" height="106" rx="12" fill="url(#glassCard)" stroke="#334155" stroke-width="1.2" />
    <rect x="18" y="18" width="30" height="30" rx="8" fill="#8b5cf6" opacity="0.85" />
    <!-- Handshake / Split Icon -->
    <path d="M 25 32 L 31 38 L 41 27" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="60" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Automated Revshare Split</text>
    <text x="60" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Creator 80% • Agency 15% • Editor 5%</text>
    
    <!-- Progress Indicator Bar -->
    <g transform="translate(60, 64)">
      <rect x="0" y="0" width="140" height="8" rx="4" fill="#1e293b" />
      <rect x="0" y="0" width="105" height="8" rx="4" fill="url(#emeraldGrad)" />
      <rect x="107" y="0" width="22" height="8" rx="4" fill="url(#purpleGlow)" />
      <rect x="131" y="0" width="9" height="8" rx="4" fill="url(#goldGrad)" />
    </g>
    <text x="210" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#10b981">Auto-Paid</text>
    <text x="60" y="93" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b">Instant payout ledger with tax withholding</text>
  </g>

  <!-- Widget Card 3: Multi-Platform Syndication (Floating A) -->
  <g class="floating-a" transform="translate(790, 296)" filter="url(#cardShadow)">
    <rect width="340" height="90" rx="12" fill="url(#glassCard)" stroke="#334155" stroke-width="1.2" />
    <rect x="18" y="16" width="30" height="30" rx="8" fill="#06b6d4" opacity="0.85" />
    <!-- Globe/Sync Icon -->
    <circle cx="33" cy="31" r="9" fill="none" stroke="#ffffff" stroke-width="1.8" />
    <path d="M 24 31 H 42 M 33 22 A 9 9 0 0 1 33 40 A 9 9 0 0 1 33 22" fill="none" stroke="#ffffff" stroke-width="1.4" />
    
    <text x="60" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Content Production &amp; Syndication</text>
    <text x="60" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">YouTube Long-Form ➔ Shorts • TikTok • Reels</text>
    
    <g transform="translate(60, 60)">
      <rect x="0" y="0" width="70" height="18" rx="5" fill="#FF0033" fill-opacity="0.2" stroke="#FF0033" stroke-width="0.8" />
      <text x="35" y="13" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#FF4D4D" text-anchor="middle">YouTube</text>

      <rect x="76" y="0" width="62" height="18" rx="5" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="0.8" />
      <text x="107" y="13" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#c084fc" text-anchor="middle">Snapchat</text>

      <rect x="144" y="0" width="56" height="18" rx="5" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="0.8" />
      <text x="172" y="13" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#38bdf8" text-anchor="middle">Meta</text>

      <rect x="206" y="0" width="75" height="18" rx="5" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="0.8" />
      <text x="243.5" y="13" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#34d399" text-anchor="middle">98.4% Sync</text>
    </g>
  </g>

  <!-- ================= LEFT-SIDE HERO CONTENT (TITLE & SUBTITLE IN FOREGROUND) ================= -->
  
  <g transform="translate(70, 70)" filter="url(#textGlow)">
    <!-- Category Mini-Pills -->
    <g transform="translate(0, 0)">
      <rect width="138" height="26" rx="13" fill="#FF0033" fill-opacity="0.18" stroke="#FF0033" stroke-width="1.2" />
      <text x="69" y="17" fill="#FF4D4D" text-anchor="middle" class="badge-label">🎬 YOUTUBE CREATOR OPS</text>

      <rect x="148" y="0" width="136" height="26" rx="13" fill="#8b5cf6" fill-opacity="0.18" stroke="#8b5cf6" stroke-width="1.2" />
      <text x="216" y="17" fill="#c084fc" text-anchor="middle" class="badge-label">💼 TALENT AGENCIES</text>

      <rect x="294" y="0" width="144" height="26" rx="13" fill="#06b6d4" fill-opacity="0.18" stroke="#06b6d4" stroke-width="1.2" />
      <text x="366" y="17" fill="#38bdf8" text-anchor="middle" class="badge-label">⚡ OPEN-SOURCE &amp; SAAS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" class="title-text" font-size="44">Awesome YouTube</text>
    <text x="0" y="132" class="title-text" font-size="44" fill="#ffffff">
      Creator Operations <tspan fill="#FF334B">&amp;</tspan> Agencies
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="174" class="subtitle-text" font-size="16">
      Curated Directory of SaaS Platforms, Agency Ecosystems &amp; Open-Source Infrastructure
    </text>
    <text x="0" y="198" class="subtitle-text" font-size="14.5" fill="#64748b">
      Sponsor pipelines • Revshare splitters • Talent management • Video ops • Content calendars
    </text>

    <!-- Capability Indicators Bar -->
    <g transform="translate(0, 230)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <circle cx="8" cy="8" r="4" fill="#FF0033" />
        <text x="20" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Talent Management</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(170, 0)">
        <circle cx="8" cy="8" r="4" fill="#8b5cf6" />
        <text x="20" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Brand Partnerships</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(340, 0)">
        <circle cx="8" cy="8" r="4" fill="#06b6d4" />
        <text x="20" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Revenue Splits &amp; CRM</text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(520, 0)">
        <circle cx="8" cy="8" r="4" fill="#10b981" />
        <text x="20" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Catalog Financing</text>
      </g>
    </g>
  </g>
</svg>
